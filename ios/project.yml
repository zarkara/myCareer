# Optional one-command project generation:  brew install xcodegen && xcodegen
# XcodeGen writes MyCareer/Info.plist from the properties below, adding the required
# bundle keys itself. Edit the keys here, not in the generated file.
name: MyCareer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  MyCareer:
    type: application
    platform: iOS
    sources:
      - MyCareer
    info:
      path: MyCareer/Info.plist
      properties:
        # Both keys together expose Documents in the Files app, so mycareer.json
        # and the exported .md are reachable without this app installed.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Declares no non-exempt encryption, which removes the export compliance
        # question from every single submission.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mycareer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # iPhone only. Supporting iPad would require a second full set of
        # screenshots and a layout pass, for no benefit at version one.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "" # set to your 10-character Team ID before archiving
  MyCareerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MyCareerTests.swift
      - path: Tests/Fixtures
        type: folder
      - path: Tests/Golden
        type: folder
    dependencies:
      - target: MyCareer
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
